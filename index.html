<style>
/* 基本リセット（iPhoneのセーフエリア対応を含む） */
html{-webkit-text-size-adjust:100%}
body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* Layout: one question card at a time, centered in a narrow column; progress dots on top, explanation slides under the choices. */
:root{
  --bg:#eef1f4; --paper:#ffffff; --ink:#1c2433; --muted:#5b6575; --line:#d5dbe3;
  --accent:#c9861a; --accent-soft:#f6ead3; --ok:#2f7a55; --ok-soft:#e1f1e8; --ng:#b33a3a; --ng-soft:#f8e3e3;
  --display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a24; --paper:#1c2431; --ink:#e7ebf1; --muted:#9aa5b5; --line:#2e3949;
  --accent:#e3a845; --accent-soft:#3a2f1b; --ok:#6fc597; --ok-soft:#1d3329; --ng:#ef8a8a; --ng-soft:#3b2222; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a24; --paper:#1c2431; --ink:#e7ebf1; --muted:#9aa5b5; --line:#2e3949;
  --accent:#e3a845; --accent-soft:#3a2f1b; --ok:#6fc597; --ok-soft:#1d3329; --ng:#ef8a8a; --ng-soft:#3b2222; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.75;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:560px;margin:0 auto;display:grid;gap:16px}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:20px}
.score{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:22px;height:6px;border-radius:3px;background:var(--line)}
.dot.ok{background:var(--ok)}.dot.ng{background:var(--ng)}.dot.now{background:var(--accent)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px 18px;display:grid;gap:14px}
.meta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.region{background:var(--accent-soft);color:var(--ink);border-radius:4px;padding:1px 8px}
h1{font-family:var(--display);font-weight:600;font-size:21px;line-height:1.5;margin:0;text-wrap:balance}
.choices{display:grid;gap:10px}
.choices.two{grid-template-columns:1fr 1fr}
@media (max-width:380px){.choices.two{grid-template-columns:1fr}}
.ch{font:inherit;font-weight:500;text-align:left;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;min-height:52px;line-height:1.5}
.ch:hover:not(:disabled){border-color:var(--accent)}
.ch:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ch:disabled{cursor:default}
.ch.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.ch.wrong{background:var(--ng-soft);border-color:var(--ng);color:var(--ng)}
.verdict{font-family:var(--display);font-weight:800;font-size:22px;margin:0}
.verdict.ok{color:var(--ok)}.verdict.ng{color:var(--ng)}
.ex{margin:0}
.years{font-family:var(--mono);font-size:12.5px;color:var(--muted);border-left:2px solid var(--accent);padding-left:10px;margin:0;font-variant-numeric:tabular-nums}
.btn{font:inherit;font-weight:700;background:var(--accent);color:#1c1406;border:0;border-radius:10px;padding:12px 18px;cursor:pointer;justify-self:start}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.big{font-family:var(--display);font-weight:800;font-size:56px;line-height:1;margin:0;font-variant-numeric:tabular-nums}
.big small{font-size:22px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.rev{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.rev li{font-size:14px;border-top:1px solid var(--line);padding-top:8px}
.rev b{color:var(--ng)}
.lede{color:var(--muted);margin:0}
@media (prefers-reduced-motion:no-preference){.card{animation:in .25s ease-out}@keyframes in{from{transform:translateY(6px)}to{transform:none}}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><div class="brand">時代感覚バグクイズ</div><div class="score" id="score"></div></div>
  <div class="dots" id="dots" aria-hidden="true"></div>
  <main id="app"></main>
</div>
<script>
// 問題データ（全100問）
// r: 地域 / q: 問題文 / c: 選択肢 / a: 正解の番号（0始まり） / e: 解説 / y: 年代メモ
const Q=[
{r:"エジプト",q:"クレオパトラに時代が近いのはどっち？",c:["大ピラミッドの完成","2026年の私たち"],a:1,e:"大ピラミッドからクレオパトラまで約2530年。クレオパトラから2026年までは約2055年で、私たちのほうが近いのです。",y:"大ピラミッド 前2560年頃 → クレオパトラ没 前30年 → 2026年"},
{r:"北極海",q:"大ピラミッドができた頃、マンモスは？",c:["もう絶滅していた","まだ生きていた"],a:1,e:"北極海のウランゲリ島では、約4000年前までマンモスが生き残っていました。ピラミッド完成から500年以上あとです。",y:"大ピラミッド 前2560年頃 / マンモス絶滅 前2000年頃"},
{r:"エジプト",q:"大ピラミッドが世界一高い建物だったのは、およそ何年間？",c:["約38年","約380年","約1000年","約3800年"],a:3,e:"中世イングランドの大聖堂の尖塔に抜かれるまで、約3800年間トップでした。",y:"大ピラミッド 前2560年頃 → リンカーン大聖堂 1311年"},
{r:"メソポタミア",q:"ハンムラビ王からクレオパトラまで約1700年。クレオパトラから1700年進むと、日本は何時代？",c:["弥生時代","平安時代","江戸時代","明治時代"],a:2,e:"約1700年後は元禄時代のあたり。同じ「古代」の中に、それだけの時間が入っています。",y:"ハンムラビ 前1750年頃 → クレオパトラ 前30年 → 1690年頃"},
{r:"メソポタミア",q:"約2500年前、バビロニアの王女エンニガルディが作ったとされるものは？",c:["博物館","動物園","劇場","病院"],a:0,e:"千年以上前の出土品にラベルを付けて並べた展示室で、世界最古の博物館とされています。",y:"エンニガルディの博物館 前530年頃"},
{r:"中国／ギリシャ",q:"孔子が死んだ約10年後に生まれたのは？",c:["ソクラテス","アリストテレス","アルキメデス","カエサル"],a:0,e:"東洋と西洋の哲学の祖は、ほぼ入れ替わりで生きていました。",y:"孔子没 前479年 / ソクラテス生 前470年頃"},
{r:"エジプト",q:"プトレマイオス朝で、エジプト語を身につけた最初の王と伝わるのは？",c:["クレオパトラ","プトレマイオス1世","アレクサンドロス大王","ツタンカーメン"],a:0,e:"王朝はギリシャ系で、約300年の間エジプト語を話す王はいなかったと伝えられています。",y:"プトレマイオス朝 前305年〜前30年"},
{r:"日本",q:"世界最古の会社・金剛組ができたのは、イスラム教の始まりより？",c:["前","後"],a:0,e:"四天王寺を建てるために百済から招かれた宮大工が578年に始めました。ムハンマドが布教を始める30年以上前です。",y:"金剛組 578年 / イスラム教の始まり 610年頃"},
{r:"イギリス／メキシコ",q:"先に始まったのはどっち？",c:["オックスフォード大学の授業","アステカの都テノチティトラン"],a:0,e:"オックスフォードの授業は遅くとも1096年。テノチティトランはその229年後です。",y:"オックスフォード 1096年頃 / テノチティトラン 1325年"},
{r:"ニュージーランド",q:"鎌倉幕府ができた頃、ニュージーランドには？",c:["誰も住んでいなかった","マオリの国があった"],a:0,e:"マオリの祖先が北島に定住したのは1250〜1275年頃。ニュージーランドは人類が最後に住みついた大きな陸地の一つです。",y:"鎌倉幕府 1185年頃 / NZ定住 1250〜1275年頃"},
{r:"ペルー",q:"マチュピチュが使われていたのは、およそ何年間？",c:["約110年","約500年","約1000年","約2000年"],a:0,e:"使われたのは1420年頃から1530年頃まで。日本の室町時代に建てられた比較的新しい都市です。",y:"使用期間 1420年頃〜1530年頃"},
{r:"トルコ／ドイツ",q:"グーテンベルクが活版印刷で聖書を刷った頃、東ローマ帝国は？",c:["まだ全盛期だった","2年前に滅んだばかり","1000年前に滅んでいた"],a:1,e:"東ローマ（ビザンツ）帝国の都が落ちたのは1453年。ローマ帝国は活版印刷の時代まで続いていたのです。",y:"コンスタンティノープル陥落 1453年 / グーテンベルク聖書 1455年頃"},
{r:"グアテマラ",q:"マヤ最後の独立王国が倒れたのはいつ？",c:["古代ローマと同じ頃","コロンブス到達の直後","ニュートン『プリンキピア』の後"],a:2,e:"最後の都ノフペテンが落ちたのは1697年。プリンキピアの10年後、日本は元禄時代です。",y:"プリンキピア 1687年 / ノフペテン陥落 1697年"},
{r:"イギリス／イタリア",q:"シェイクスピアと同じ1564年生まれは？",c:["ガリレオ","ニュートン","ダ・ヴィンチ","モーツァルト"],a:0,e:"英文学の頂点と近代科学の父は同い年です。",y:"ガリレオ 1564年2月 / シェイクスピア 1564年4月"},
{r:"イギリス／アメリカ",q:"ダーウィンと同じ年の同じ日に生まれたのは？",c:["リンカーン","ナポレオン","ベートーヴェン","ワシントン"],a:0,e:"2人とも1809年2月12日、大西洋の両側で生まれました。",y:"1809年2月12日"},
{r:"イギリス",q:"先に発明されたのはどっち？",c:["FAX","電話"],a:0,e:"FAXの特許は1843年。電話の特許より33年早く、日本はまだ天保年間でした。",y:"FAX 1843年 / 電話 1876年"},
{r:"日本／フランス",q:"任天堂が創業した1889年に完成したのは？",c:["エッフェル塔","自由の女神","ビッグ・ベン","東京タワー"],a:0,e:"エッフェル塔は1889年3月に完成。任天堂はその半年後、京都の花札屋として始まりました。",y:"エッフェル塔 1889年3月 / 任天堂 1889年9月"},
{r:"アメリカ",q:"南北戦争の年金は、いつまで支払われていた？",c:["1900年","1920年","1956年","2020年"],a:3,e:"元兵士が83歳のときに生まれた娘が、2020年に亡くなるまで受け取っていました。終戦から155年後です。",y:"南北戦争終結 1865年 / 最後の受給者死去 2020年"},
{r:"日本",q:"先に始まったのはどっち？",c:["青森・三内丸山の大集落","エジプトの大ピラミッド"],a:0,e:"三内丸山の集落は約5900年前に始まり、大ピラミッドより1000年以上早い大集落でした。",y:"三内丸山 前3900年頃〜 / 大ピラミッド 前2560年頃"},
{r:"フランス",q:"フランスで最後にギロチンが使われた年に公開された映画は？",c:["スター・ウォーズ","風と共に去りぬ","ローマの休日","タイタニック"],a:0,e:"最後の執行は1977年9月。アメリカで『スター・ウォーズ』が公開された4か月後でした。",y:"スター・ウォーズ 1977年5月 / 最後の執行 1977年9月"},
{r:"地球史",q:"ティラノサウルスに時代が近いのはどっち？",c:["ステゴサウルス","人間"],a:1,e:"ステゴサウルスとティラノの間は約8000万年。ティラノから人間までの約6600万年より離れています。",y:"ステゴサウルス 約1億5000万年前 / ティラノ 約6800万〜6600万年前"},
{r:"地球史",q:"先に地球に現れたのはどっち？",c:["サメ","木"],a:0,e:"サメは約4億5000万年前、最初の木は約3億8500万年前。サメは木のない地球を6000万年以上泳いでいました。",y:"サメ 約4億5000万年前 / 木 約3億8500万年前"},
{r:"韓国／ドイツ",q:"ハングルが作られた1440年代、ヨーロッパで実用化されたのは？",c:["活版印刷","蒸気機関","望遠鏡","電話"],a:0,e:"世宗がハングルを作ったのは1443年。同じ頃、グーテンベルクが活版印刷を実用化していました。",y:"ハングル 1443年 / グーテンベルク聖書 1455年頃"},
{r:"インド／アメリカ",q:"タージ・マハルの建設が始まった頃に創立された大学は？",c:["ハーバード大学","オックスフォード大学","東京大学","マサチューセッツ工科大学"],a:0,e:"タージ・マハル着工は1632年頃、ハーバード創立は1636年です。",y:"タージ・マハル 1632年頃 / ハーバード 1636年"},
{r:"イギリス／日本",q:"ロンドンで世界初の地下鉄が開業したとき、日本は何時代？",c:["江戸時代","明治時代","大正時代","昭和時代"],a:0,e:"開業は1863年1月。明治に改元する5年前で、この年に新選組の前身も結成されています。",y:"ロンドン地下鉄 1863年 / 明治改元 1868年"},
{r:"ドイツ",q:"神聖ローマ帝国が消滅したのは、誰の時代？",c:["カール大帝","コロンブス","ナポレオン","ビスマルク"],a:2,e:"中世の響きがありますが、ナポレオンに追い詰められて1806年に解散しました。",y:"神聖ローマ帝国 962年〜1806年"},
{r:"日本",q:"太陽暦に切り替えた明治5年、12月は何日まであった？",c:["2日","15日","29日","31日"],a:0,e:"明治5年12月3日を明治6年1月1日にしたため、12月は2日で終わりました。",y:"明治5年12月2日の翌日 → 明治6年1月1日"},
{r:"オランダ／アメリカ",q:"アンネ・フランクと同じ1929年生まれは？",c:["キング牧師","ガンジー","チャーチル","リンカーン"],a:0,e:"『アンネの日記』のアンネと公民権運動のキング牧師は同い年です。",y:"キング牧師 1929年1月 / アンネ・フランク 1929年6月"},
{r:"アメリカ",q:"ライト兄弟の初飛行から、人類の月面着陸までは何年？",c:["30年","66年","120年","200年"],a:1,e:"わずか66年。弟のオーヴィルは1948年まで生き、飛行機が音速を超えるところまで見届けました。",y:"初飛行 1903年 / 月面着陸 1969年"},
{r:"エチオピア",q:"2026年10月、エチオピアの暦では何年？",c:["2019年","2026年","2033年","1447年"],a:0,e:"エチオピアは独自の暦で、年の数え方が7〜8年遅れています。1年は13か月です。",y:"エチオピア暦の新年 9月11日"},
{r:"アメリカ／日本",q:"新選組の前身が結成された1863年、アメリカで起きたのは？",c:["独立宣言","ゲティスバーグの戦い","大陸横断鉄道の完成","真珠湾攻撃"],a:1,e:"南北戦争最大の激戦で、リンカーンの有名な演説も同じ年です。",y:"壬生浪士組 1863年3月 / ゲティスバーグ 1863年7月"},
{r:"地球史",q:"恐竜と同じ時代に、すでに生きていたのは？",c:["ワニの仲間","マンモス","サーベルタイガー","ゴリラ"],a:0,e:"ワニの仲間は恐竜の時代から生き延びてきたグループです。マンモスやサーベルタイガーは恐竜が絶滅してから何千万年も後の動物です。",y:"恐竜の絶滅 約6600万年前"},
{r:"地球史",q:"ステゴサウルスが生きていた頃の地球に、まだなかったのは？",c:["花","森","昆虫","海"],a:0,e:"花を咲かせる植物が現れたのは約1億3000万年前。約1億5000万年前のステゴサウルスは、花を見たことがありません。",y:"ステゴサウルス 約1億5000万年前 / 花の出現 約1億3000万年前"},
{r:"地球史",q:"先に地球に現れたのはどっち？",c:["ゴキブリの仲間","恐竜"],a:0,e:"ゴキブリの祖先は約3億年以上前から。恐竜が現れたのは約2億3000万年前で、ゴキブリのほうが大先輩です。",y:"ゴキブリの祖先 約3億年以上前 / 恐竜 約2億3000万年前"},
{r:"人類史",q:"私たちホモ・サピエンスが現れたのは、約何年前？",c:["約5000年前","約3万年前","約30万年前","約300万年前"],a:2,e:"モロッコで見つかった化石から、約30万年前とされています。文字を使い始めたのはそのうち最後の約5000年だけです。",y:"ホモ・サピエンス 約30万年前"},
{r:"人類史",q:"ネアンデルタール人が姿を消したのは、約何年前？",c:["約4万年前","約40万年前","約400万年前","約4000年前"],a:0,e:"約4万年前まで生きていて、私たちの祖先と同じ時代を過ごしていました。今の人の多くにもその遺伝子が少し残っています。",y:"ネアンデルタール人の絶滅 約4万年前"},

const N=10;
let round=[],i=0,res=[];
const app=document.getElementById("app");
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
function dots(){document.getElementById("dots").innerHTML=round.map((_,k)=>`<span class="dot ${k<res.length?(res[k]?"ok":"ng"):k===i?"now":""}"></span>`).join("");
  document.getElementById("score").textContent=round.length?`${Math.min(i+1,N)} / ${N} 問 ・ 正解 ${res.filter(Boolean).length}`:"";}
function start(){round=shuffle(Q).slice(0,N).map(q=>{const order=shuffle(q.c.map((_,k)=>k));return{...q,order}});i=0;res=[];show()}
function show(){const q=round[i];dots();
  app.innerHTML=`<section class="card"><div class="meta"><span class="region">${esc(q.r)}</span><span>第${i+1}問</span></div>
  <h1>${esc(q.q)}</h1><div class="choices ${q.c.length===2?"two":""}">${q.order.map(k=>`<button class="ch" id="c${k}" data-k="${k}">${esc(q.c[k])}</button>`).join("")}</div><div id="after"></div></section>`;
  app.querySelectorAll(".ch").forEach(b=>b.addEventListener("click",()=>answer(+b.dataset.k)));
  app.querySelector(".ch").focus({preventScroll:true});}
function answer(k){const q=round[i];const ok=k===q.a;res.push(ok);
  app.querySelectorAll(".ch").forEach(b=>{b.disabled=true;const kk=+b.dataset.k;if(kk===q.a)b.classList.add("right");else if(kk===k)b.classList.add("wrong")});
  const last=i===N-1;
  document.getElementById("after").innerHTML=`<div style="display:grid;gap:10px"><p class="verdict ${ok?"ok":"ng"}">${ok?"正解":"ざんねん"}</p><p class="ex">${esc(q.e)}</p><p class="years">${esc(q.y)}</p><button class="btn" id="next">${last?"結果を見る":"次の問題"}</button></div>`;
  dots();const n=document.getElementById("next");n.addEventListener("click",()=>{if(last)finish();else{i++;show()}});n.focus({preventScroll:true});}
function finish(){i=N;dots();const sc=res.filter(Boolean).length;
  const msg=sc>=9?"時代感覚、ほぼバグっていません。":sc>=6?"かなりの年表力です。":sc>=3?"バグに気づけたなら上出来です。":"知らなかった分だけ、おもしろかったはずです。";
  const miss=round.filter((_,k)=>!res[k]);
  app.innerHTML=`<section class="card"><p class="lede">結果</p><p class="big">${sc}<small> / ${N}</small></p><p class="ex">${msg}</p>
  ${miss.length?`<p class="lede">まちがえた問題</p><ul class="rev">${miss.map(q=>`<li>${esc(q.q)}<br>答え：<b>${esc(q.c[q.a])}</b><br><span class="lede">${esc(q.y)}</span></li>`).join("")}</ul>`:""}
  <div class="row"><button class="btn" id="again">もう一度（別の10問）</button></div><p class="lede">全${Q.length}問から毎回ランダムに10問出ます。</p></section>`;  document.getElementById("again").addEventListener("click",start);}
start();
</script>
